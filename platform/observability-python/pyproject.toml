[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-observability"
version = "0.1.0"
description = "Shared OpenTelemetry helpers for homelab-llm services"
requires-python = ">=3.11"
dependencies = [
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
  "opentelemetry-instrumentation-fastapi>=0.46b0,<1",
]

[dependency-groups]
dev = [
  "fastapi>=0.115,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
