[project]
name = "youtube-transcript-api-service"
version = "0.1.0"
description = "Localhost OpenAI-compatible YouTube transcript acquisition service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn>=0.30,<1.0",
  "youtube-transcript-api==1.2.4",
]

[project.scripts]
youtube-transcript-api = "youtube_transcript_api_service.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
